<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="csrf-token" content="{{ csrf_token() }}"><title>Attendance Dashboard</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><main class="container"><h1>Attendance System</h1><p>Verify each student's identity before scanning their QR.</p>

<p id="status" role="status" aria-live="polite"></p><div id="reader" hidden></div>
<p>Active Students: <span id="count">0</span></p><h2>Attendance Records</h2><ul id="attendanceList"></ul>

</main><script src="{{ url_for('static', filename='vendor/jsQR.js') }}" defer></script><script src="{{ url_for('static', filename='js/qr-camera.js') }}" defer></script><script src="{{ url_for('static', filename='js/scanner.js') }}" defer></script></body></html>
