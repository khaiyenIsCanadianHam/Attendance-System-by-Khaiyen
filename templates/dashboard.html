<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Hanami · Attendance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">Hanami</a>
    <form method="POST" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="secondary" type="submit">Sign out</button>
    </form>
  </header>
  <main class="workspace">
    <div class="heading"><h1>Attendance</h1><span>Active: <strong id="count">0</strong></span></div>
    <div class="controls" aria-label="Attendance actions">
      <button id="recordBtn">Start scanner</button>
      <button id="stopBtn" class="secondary" disabled>Stop scanner</button>
      <button id="downloadBtn" class="secondary">Download CSV</button>
      <button id="timeoutAllBtn" class="danger">Time out all</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="reader" hidden aria-label="QR camera"></div>
    <div class="table-scroll">
      <table>
        <caption class="sr-only">Attendance records</caption>
        <thead><tr><th scope="col">Student</th><th scope="col">Section</th><th scope="col">Time in</th><th scope="col">Time out</th><th scope="col">Duration</th><th scope="col">Action</th></tr></thead>
        <tbody id="attendanceList"></tbody>
      </table>
    </div>
    <p id="syncStatus" class="muted" role="status" aria-live="polite">Roster: checking connection…</p>
  </main>
  <script src="{{ url_for('static', filename='vendor/jsQR.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/qr-camera.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/scanner.js') }}" defer></script>
</body>
</html>
